; UltimateMultiplayerator.asi - online play for GTA San Andreas 1.0 US.
; The launcher (UMLauncher.bat) writes the [Connect] part; you can also fill it in by hand.
[UltimateMultiplayerator]
; 0 = the mod does nothing at all
Enabled=1

[Connect]
; the server to join when the game starts. Empty = single player (the mod stays out of the way).
; While a server is set here, the split-screen mod switches itself off for that session.
Host=
Port=7777
Name=Player
Password=
