[SplitScreen]
; 0 = the split-screen mod does nothing at all. It also switches itself off for a session in which the online mod
; (UltimateMultiplayerator.ini) is on and has a server to join.
Enabled=1
; 1 = player 2 appears next to player 1 shortly after the game starts (player 1 must be on foot)
AutoSpawn=1
; 0 = left/right, 1 = top/bottom
Layout=0
; Virtual-key codes. 118 = F7 shows/hides player 2's view, 119 = F8 brings player 2 to player 1
ToggleViewKey=118
TeleportKey=119
; 1 = draw the two views with textured quads instead of StretchRect (try this if the picture is black or garbled)
ForceQuadComposite=0
; 1 = turn off the game's built-in shared-camera co-op rules
DisableCoopRules=1
; 1 = a player's lock-on (auto-aim) never picks the other player. 0 = players can lock on to each other
NoLockOnPlayers=1
; 1 = gangs, police and everybody else treat player 2 exactly as they treat player 1 (Grove Street does not turn on
;     player 2, and helps player 2 as it helps player 1). 0 = as in the game's data, where the second player is a stranger
PlayersAlike=1
; Frames per second at most (FramerateVigilante's figure, which it only applies with the game's own Frame Limiter
; switched on). The game times smoke, sparks and the sway of a car's body in frames. 0 = no limit
FrameLimit=60
; 1 = what a vehicle does while it is prepared for drawing (body swing, loose panels, exhaust, dust, sparks) happens
; once per frame, not once for each of the two views. 0 = as the game does it per view
EffectsOncePerFrame=1
; Who hears the world: 0 = both players (every sound plays once, placed from the nearer player),
; 1 or 2 = only that player. Key 117 = F6 cycles it while playing
AudioPlayer=0
AudioKey=117
; 120 = F9 saves both views as SplitScreen_shotNN_p1.bmp / _p2.bmp next to the game exe
ScreenshotKey=120
; 1 = two automatic screenshots and periodic view checks in SplitScreen.log (development aid)
DebugShots=0
; 1 = either player can start a mission. When a player walks into a mission marker both players are asked (the
; question stays 7 seconds): each holds L1/LB and presses X/A to accept; the player who is not in the marker can
; press Square/X instead to accept and be taken along when the mission starts; L1/LB + Triangle/Y rejects. If the
; player who walked in is player 2, the two swap roles for the mission (the game's script knows one character;
; each keeps place, looks, money, weapons and half of the screen) and swap back after it. During a mission, steps
; like "get in the car" or "reach this place" count for either player. Nobody is moved except by the mission itself
MissionsAndShopsForBoth=1

; 1 = wherever the game checks "is this ped the player?" right after asking who the player is, any player counts
; (about 100 places in the game's code). 0 = the game's own checks, which know one player at a time.
AnyPlayerCounts=1
; 1 = each player has their own statistics and skills (respect, stamina, muscle, weapon and driving skills, ...).
; Player 2's are kept in SplitScreen_player2_stats.bin next to the exe. 0 = one shared set, as in single player
SeparateStats=1
; 1 = money and respect that a mission or job script gives player 1 are given to player 2 as well
MissionRewardsForBoth=1
; Aiming with a controller. 1 = when you press aim the character turns to where your camera looks, so the lock-on
; picks what you are looking at and a crosshair without lock-on starts at the view direction; and when you break a
; lock-on with the stick the crosshair starts on that target. 0 = plain GTA SA (crosshair starts in front of the character)
AimStyle=1
; Wanted level: 0 = each player has their own. ShareWantedGain=1: when one player's level rises, the other's rises
; to it. ShareWantedLoss=1: when one player's level falls (timer, bribe, respray, ...), the other's falls to it
ShareWantedGain=0
ShareWantedLoss=0
; Dropping things in front of you, on foot. Controller: hold L1/LB (RB with gta5likecontrols.asi) and press D-pad up
; (one magazine of the weapon in hand; a melee weapon, the last magazine or unlimited ammunition drops the weapon
; itself) or D-pad down (money). Keyboard, player 1: Tab + G (weapon), Tab + M (money), and the keys below
DropMoneyAmount=100

[Revive]
; A player who loses all health, or is arrested, goes down first. The other player stands next to them and holds
; L1/LB (keyboard: player 1's action key, player 2's Action key below) to help them up. The downed player can hold
; enter/exit for 2 seconds to give up. Nobody helps in time: wasted / busted as usual.
Enabled=1
; Seconds to help a player with no health, and how much shorter it gets each time in a row (full health resets it).
; At 0 seconds or less the player is wasted at once
WastedSeconds=90
WastedPenalty=30
; The same for an arrested player (resets when that player's wanted level goes down)
BustedSeconds=180
BustedPenalty=60
; Health after being helped up, and how long the helper holds the button (ms). The helper must stand right next
; to the downed player; the countdown stops while they are helping
Health=20
HoldMs=8000

[Player1Keys]
; virtual-key codes: 55 = 7, 57 = 9
DropWeapon=55
DropMoney=57

[Player2Keys]
; Keyboard control for player 2, on top of the second controller. Virtual-key codes, 0 = unused.
Enabled=1
; I K J L = move
Up=73
Down=75
Left=74
Right=76
; U O = turn the camera
LookLeft=85
LookRight=79
; Right Shift = sprint (accelerate in a vehicle)
Sprint=161
; / = jump (brake/reverse in a vehicle)
Jump=191
; ; = fire
Fire=186
; P = enter/exit vehicle
EnterExit=80
; ' = aim
Aim=222
; [ ] = previous/next weapon
PrevWeapon=219
NextWeapon=221
; . = crouch
Crouch=190
Action=163
; 103 = numpad 7, 105 = numpad 9
DropWeapon=103
DropMoney=105
