; gta5likecontrols.asi - GTA V style controller layout for GTA San Andreas 1.0 US.
; Needs a controller the game already understands as a standard pad (GInput does that for Xbox controllers; keep
; GInput on its San Andreas layout). Keyboard and mouse are not changed.
;
;   on foot:     LT aim (locks on), RT fire, B reload (a punch or swing when no gun is in hand), hold LB = weapon
;                wheel (right stick picks, release selects; a short tap switches between fists and the last
;                weapon), D-pad up or RB = what LB did (answer phone, "action")
;   in vehicle:  RT accelerate, LT brake / reverse, RB handbrake, LB fire, D-pad up = what LB did
;   the triggers no longer cycle weapons or targets; everything else is as in San Andreas
[Controls]
Enabled=1
; the wheel on LB, on foot (0 = LB does nothing on foot)
WeaponWheel=1
; 1 = slow the game down while the wheel is open
WheelSlowMotion=0
; B reloads the gun in hand (0 = B fires, as in San Andreas)
ReloadButton=1
; show the new buttons in the game's texts ("press ... to fire"), also in texts of other mods that use the game's
; button names
ButtonNamesInTexts=1
; how far a trigger must be pulled to count as aim / fire (0-255)
TriggerPress=50
