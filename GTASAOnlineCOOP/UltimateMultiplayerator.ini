; UltimateMultiplayerator.asi - online play for GTA San Andreas (client version 2).
; The launcher (UMLauncher.bat) writes the [Connect] part; you can also fill it in by hand.

[UltimateMultiplayerator]
; 0 = the mod does nothing at all
Enabled=1
; hold this key to see who is online and your ping (Windows virtual key code; 118 = F7)
PlayerListKey=118
; 1 = the other players' names and health over their heads
NameTags=1

[Connect]
; The server to join. Empty Host = single player, the mod changes nothing.
; Start or load a game as usual: the mod joins as soon as you are in the world.
; While a server is set here, the split-screen mod switches itself off for that session.
Host=192.168.0.13
Port=7777
Name=Player1
Password=yourpassword
