; UltimateMultiplayeratorOnline.asi - P2P open-world co-op (every PC runs its own game; players, vehicles and the
; street are passed between them; no missions).
[Net]
Enabled=1
; your nickname (shown on the map / players list; your part of the mod's save is kept under it). Empty = a random one.
Name=
; UDP port this game listens on (0 = 7800 + your player number, which is made from your nickname - better set it).
; It must be reachable by the other players (port forwarding / VPN).
Port=0
; the other players: host:port,host:port   e.g. 192.168.0.12:7802 - ONE player who is in the game is enough (it tells
; this game where everybody else is; LAN and VPN alike)
Peers=192.168.0.13:7801,192.168.0.11:7802

[Save]
; the mod's own save slot, 1..10 (files UMOnline<N>.b / .players in the game's user files folder; vanilla saves
; are not used). The game starts from it at once; a save disk, every mission passed and every job ended save into it.
Slot=1

[Test]
; several games on one PC: 1..4 = a window in that quarter of the screen, a second game allowed, input only for the window in front
Window=0
; 1..8 = load that save without the menu
LoadSave=0
