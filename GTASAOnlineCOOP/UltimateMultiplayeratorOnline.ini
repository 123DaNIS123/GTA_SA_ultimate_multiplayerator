; UltimateMultiplayeratorOnline.asi - P2P open-world co-op (every PC runs its own game; players, vehicles and the
; street are passed between them; no missions).
[Net]
Enabled=1
; this player's number: 1, 2, 3 ... (every player a different one; the lowest number near you fills the street)
Id=1
; UDP port this game listens on (0 = 7800 + Id). It must be reachable by the other players (port forwarding / VPN).
Port=0
; the other players: host:port,host:port   e.g. 192.168.0.12:7802,192.168.0.13:7803
Peers=

[Test]
; several games on one PC: 1..4 = a window in that quarter of the screen, a second game allowed, input only for the window in front
Window=0
; 1..8 = load that save without the menu
LoadSave=0
