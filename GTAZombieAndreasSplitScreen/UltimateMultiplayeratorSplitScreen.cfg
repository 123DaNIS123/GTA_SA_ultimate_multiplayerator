; Split screen for Zombie Andreas' own two-player mode (UltimateMultiplayeratorZA.asi).
; The game's co-op makes the second player and runs its own rules; this mod only gives each player a view and a
; camera of their own. Everything it does for the original game's missions and shops is switched off here.
[SplitScreen]
Enabled=1
; 1 = the pad's "use a medkit in the car" button (the aim button) does nothing, so that it can be the drive-by button
NoCarMedkitButton=1
; 1 = a text that exists in a "(Player 2)" version is shown on the screen of the player it is for only
MessagesPerPlayer=1
; the second player comes from the game's co-op
AutoSpawn=0
; 0 = side by side, 1 = one above the other
Layout=0
; F7: show/hide the second view; F9: save both views as pictures
ToggleViewKey=118
ScreenshotKey=120
MissionsAndShopsForBoth=0
AnyPlayerCounts=0
SeparateStats=0
MissionRewardsForBoth=0
AimStyle=1
DisableCoopRules=1

[Revive]
Enabled=0

[Player2Keys]
; the second player uses the second controller; no keyboard keys of this mod on top
Enabled=0
